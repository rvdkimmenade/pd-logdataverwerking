services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: register_owner
      POSTGRES_DB: register
      POSTGRES_PASSWORD_FILE: /run/secrets/password
    secrets: [password]
    ports: ['127.0.0.1:${REGISTER_DB_PORT:-15433}:5432']
    volumes: [register_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U register_owner -d register']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  register_data:
secrets:
  password:
    file: ${REGISTER_OWNER_PASSWORD_FILE:?Use register scripts}
